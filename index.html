<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A5FA8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jacarandá">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Jacarandá ⚓</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d2a52;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:linear-gradient(160deg,#1a4a8a,#0d2a52);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:32px 24px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.logo{font-size:52px;margin-bottom:12px}
h1{color:#fff;font-size:22px;font-weight:800;margin-bottom:4px}
.sub{color:rgba(255,255,255,.55);font-size:13px;margin-bottom:24px;line-height:1.5}
.progress{height:3px;background:rgba(255,255,255,.1);border-radius:2px;margin-bottom:24px;overflow:hidden}
.bar{height:100%;background:#6DB847;border-radius:2px;animation:fill 1.8s ease forwards}
@keyframes fill{from{width:0}to{width:100%}}
.btn{display:block;background:#6DB847;color:#fff;font-weight:700;font-size:15px;padding:14px;border-radius:12px;text-decoration:none;margin-bottom:10px;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn-outline{background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);font-size:13px;padding:10px;border-radius:10px;margin-bottom:0}
.hint{color:rgba(255,255,255,.4);font-size:11px;margin-top:16px;line-height:1.7;padding:10px;background:rgba(255,255,255,.05);border-radius:8px}
.hint strong{color:rgba(255,255,255,.7)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">⚓</div>
  <h1>LOG-IN Jacarandá</h1>
  <p class="sub">Sistema de Relatórios a Bordo<br>M/V LOG-IN Jacarandá · Linha Amazonas</p>
  <div class="progress"><div class="bar"></div></div>
  <a href="jacaranda_manutencao.html" class="btn" id="btn-open">🚀 Abrir App</a>
  <div id="hint-box" class="hint" style="display:none"></div>
</div>
<script>
const mob=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const ios=/iPhone|iPad|iPod/i.test(navigator.userAgent);
const standalone=window.matchMedia('(display-mode:standalone)').matches||navigator.standalone;
const hint=document.getElementById('hint-box');

if(standalone){
  location.href='jacaranda_manutencao.html';
} else {
  if(ios){
    hint.style.display='block';
    hint.innerHTML='📱 Para instalar no iPhone/iPad:<br><strong>□↑ Compartilhar</strong> → <strong>Adicionar à Tela de Início</strong>';
  } else if(mob){
    hint.style.display='block';
    hint.innerHTML='📱 Para instalar no Android:<br>Toque em <strong>⋮ Menu</strong> → <strong>Adicionar à tela inicial</strong>';
  } else {
    hint.style.display='block';
    hint.innerHTML='💻 No Chrome/Edge: <strong>⋮ → Instalar app</strong> para adicionar ao desktop';
  }
  setTimeout(()=>{ location.href='jacaranda_manutencao.html'; }, mob?2500:1500);
}
if('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script>
</body>
</html>
