<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A5FA8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jacarandá">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Jacarandá ⚓</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d2a52;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{background:linear-gradient(160deg,#1a4a8a,#0d2a52);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:36px 24px 28px;max-width:340px;width:100%;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.5);}
.anchor{font-size:58px;margin-bottom:14px;}h1{color:#fff;font-size:24px;font-weight:800;margin-bottom:4px;}
.vessel{color:#6DB847;font-size:13px;font-weight:700;margin-bottom:4px;}
.route{color:rgba(255,255,255,.4);font-size:11px;margin-bottom:28px;letter-spacing:1px;text-transform:uppercase;}
.bar-wrap{height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-bottom:28px;overflow:hidden;}
.bar{height:100%;background:#6DB847;animation:load 2s ease forwards;}
@keyframes load{0%{width:0}100%{width:100%}}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;background:#6DB847;color:#fff;font-weight:700;font-size:16px;padding:15px 20px;border-radius:13px;text-decoration:none;margin-bottom:12px;box-shadow:0 4px 16px rgba(109,184,71,.35);}
.hint{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px 14px;margin-top:4px;text-align:left;}
.step{display:flex;gap:8px;margin-bottom:7px;font-size:12px;color:rgba(255,255,255,.65);line-height:1.5;align-items:flex-start;}
.step:last-child{margin-bottom:0;}
.n{background:rgba(255,255,255,.15);color:#fff;border-radius:50%;width:20px;height:20px;min-width:20px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;margin-top:1px;}
strong{color:rgba(255,255,255,.9);}
.build{color:rgba(255,255,255,.2);font-size:9px;margin-top:16px;font-family:monospace;}
</style>
</head>
<body>
<div class="card">
  <div class="anchor">⚓</div>
  <h1>LOG-IN Jacarandá</h1>
  <div class="vessel">M/V LOG-IN JACARANDÁ</div>
  <div class="route">Linha Amazonas · Relatórios a Bordo</div>
  <div class="bar-wrap"><div class="bar"></div></div>
  <a href="jacaranda_manutencao.html" class="cta">🚀 &nbsp;Abrir App</a>
  <div class="hint" id="hint"></div>
  <div class="build">build 20260423_0002</div>
</div>
<script>
const mob=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const ios=/iPhone|iPad|iPod/i.test(navigator.userAgent);
const sa=window.matchMedia('(display-mode:standalone)').matches||window.navigator.standalone===true;
const h=document.getElementById('hint');
const s=(n,t)=>'<div class="step"><div class="n">'+n+'</div><div>'+t+'</div></div>';
if(sa){location.replace('jacaranda_manutencao.html');}
else if(ios){h.innerHTML=s(1,'Abra no <strong>Safari</strong>')+s(2,'Toque em <strong>□↑ Compartilhar</strong>')+s(3,'<strong>Adicionar à Tela de Início</strong>')+s(4,'Toque <strong>Adicionar</strong> → ⚓');setTimeout(()=>location.replace('jacaranda_manutencao.html'),4500);}
else if(mob){h.innerHTML=s(1,'Abra no <strong>Chrome</strong>')+s(2,'Toque nos <strong>3 pontos ⋮</strong>')+s(3,'<strong>Adicionar à tela inicial</strong>')+s(4,'Confirme → ⚓');setTimeout(()=>location.replace('jacaranda_manutencao.html'),4500);}
else{h.innerHTML=s('💻','Chrome/Edge: <strong>⋮ → Instalar app</strong>');setTimeout(()=>location.replace('jacaranda_manutencao.html'),2000);}
if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script>
</body>
</html>
